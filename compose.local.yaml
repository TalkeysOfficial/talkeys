# Local stack: docker compose -f compose.yaml -f compose.local.yaml up --build
# Needs Server/.env (copy Server/.env.example). DB_URL is overridden to the local mongo.
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    environment:
      DB_URL: mongodb://mongo:27017/talkeys_dev
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./Client
      args:
        BACKEND_URL: http://localhost:4890
        NEXT_PUBLIC_BASE_URL: http://localhost:3000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
