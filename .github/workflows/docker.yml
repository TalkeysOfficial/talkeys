name: Deploy to Web Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "
            cd '$DEPLOY_PATH' &&
            git fetch origin main &&
            git reset --hard origin/main &&
            docker compose up --build -d server &&
            docker image prune -f
          "

      - name: Check API Status
        run: |
          for i in {1..3}; do
            RESPONSE=$(curl --write-out "%{http_code}" --silent --output /dev/null https://api.talkeys.xyz/getEvents)
            if [ "$RESPONSE" -eq 200 ]; then
              echo "API is up and running!"
              exit 0
            else
              echo "API returned status code $RESPONSE, retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "API failed to start after multiple attempts"
          exit 1
