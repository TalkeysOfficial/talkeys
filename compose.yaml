# Production-shaped: the API only. The VM runs `docker compose up --build -d server` from the repo root.
# DB_URL comes from Server/.env (never committed). For a local stack see compose.local.yaml.
services:
  server:
    build: ./Server
    image: talkeys/backend
    env_file: Server/.env
    ports:
      - "4890:8000"
    volumes:
      - server-log:/app/log
    restart: unless-stopped

volumes:
  server-log:
